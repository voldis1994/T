[project]
name = "shadow-robot"
version = "1.0.0"
description = "SHADOW Capital.com 1m zone/structure trading robot"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115.0,<0.116",
  "uvicorn[standard]>=0.34.0,<0.35",
  "httpx>=0.28.0,<0.29",
  "websockets>=14.0,<16",
  "pydantic>=2.10.0,<3",
  "pydantic-settings>=2.7.0,<3",
  "python-dotenv>=1.0.1,<2",
  "numpy>=2.1.0",
  "pandas>=2.2.0",
  "PyYAML>=6.0.1",
  "aiofiles>=24.1.0,<25",
  "python-multipart>=0.0.20",
]

[project.scripts]
shadow = "shadow.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]