[project]
name = "shadow-robot"
version = "1.0.0"
description = "SHADOW Capital.com 1m zone/structure trading robot"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "httpx==0.28.1",
  "websockets==14.1",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "python-dotenv==1.0.1",
  "numpy==2.2.1",
  "pandas==2.2.3",
  "pyyaml==6.0.2",
  "aiofiles==24.1.0",
  "python-multipart==0.0.20",
]

[project.scripts]
shadow = "shadow.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]